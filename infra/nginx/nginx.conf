events {
    worker_connections 1024;
}

http {
    upstream submission_api {
        server submission-api-1:8080;
        server submission-api-2:8080;
    }

    server {
        listen 80;

        # Frontend estático (quando houver)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Balanceamento para a Submission API
        location /api/ {
            proxy_pass http://submission_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
    }
}
